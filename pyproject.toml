[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audioloop"
version = "0.1.0"
description = "Active learning framework for binary audio classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Daniel Avery", email = "audioloop@danavery.com"},
]
keywords = ["audio", "machine-learning", "active-learning", "classification", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "flask>=3.0.0",
    "matplotlib>=3.7.0",
    "numpy>=2.3.0",
    "pyyaml>=6.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchcodec>=0.10.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
test = [
    "basedpyright>=1.31.7",
    "pytest>=8.4.1",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff",
]


[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/.venv",
    "**/data",
    "**/outputs",
    "**/subsets",
    "**/training_sets",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/dist",
    "**/build",
]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
# extend-select = ["I", "B", "SIM", "RET"]
extend-select = ["I", "B", "SIM", "RET", "UP", "C4", "F", "RUF", "TID", "E"]
ignore = ["RET504", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/audioloop/label_audio.py" = ["RET508"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:.*At least one mel filterbank has all zero values.*:UserWarning:torchaudio.functional.functional"
]

# Coverage is opt-in (`pytest --cov`), not in addopts, so single-test iteration stays fast.
[tool.coverage.run]
source = ["src/audioloop"]
omit = [
    # Interactive surfaces only — batch CLI entry points (train.py, build_features.py, ...)
    # stay counted so their missing tests remain visible in the report.
    "src/audioloop/webui/*",
    "src/audioloop/label_audio.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1

[tool.hatch.build.targets.wheel]
packages = ["src/audioloop"]
