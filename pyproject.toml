[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audioloop"
version = "0.1.0"
description = "Active learning framework for binary audio classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Daniel Avery", email = "audioloop@danavery.com"},
]
keywords = ["audio", "machine-learning", "active-learning", "classification", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "basedpyright>=1.31.7",
    "matplotlib>=3.7.0",
    "numpy>=2.3.0",
    "pytest>=8.4.1",
    "pyyaml>=6.0",
    "ruff",
    "soundfile>=0.13.1",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
]
webui = [
    "flask>=3.0.0",
]


[tool.ruff]
line-length = 100

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff.lint]
# extend-select = ["I", "B", "SIM", "RET"]
extend-select = ["I", "B", "SIM", "RET", "UP", "C4", "F", "RUF", "TID", "E"]
ignore = ["RET504", "E501"]

[tool.ruff.lint.per-file-ignores]
"audioloop/label_audio.py" = ["RET508"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:.*At least one mel filterbank has all zero values.*:UserWarning:torchaudio.functional.functional"
]

[tool.hatch.build.targets.wheel]
packages = ["src/audioloop"]
